# HARDWARE CONFIGURATION
# ----------------------
# Verify your Vendor/Product ID if this doesn't work.
# Common IDs: 0x1189:0x8890, 0x1189:0x8842
vendor_id: 0x1189
product_id: 0x8890

# MAC KEY MAPPING LEGEND
# ----------------------
# cmd   = Command (⌘)
# opt   = Option (⌥)
# ctrl  = Control (^)
# shift = Shift (⇧)

# ORIENTATION
# -----------
# 'counterclockwise' puts the knobs at the TOP and buttons at the BOTTOM.
orientation: counterclockwise

# NATIVE MATRIX
rows: 3
columns: 4
knobs: 2

layers:
  # =================================================================
  # LAYER 1: PRODUCTIVITY (The "Work" Layer)
  # =================================================================
  - buttons:
      # Visual Row 1 (Top)
      - ["cmd-c",         "cmd-v",         "cmd-x"]        # Copy, Paste, Cut
      # Visual Row 2
      - ["cmd-z",         "cmd-shift-z",   "cmd-f"]        # Undo, Redo, Find
      # Visual Row 3
      - ["cmd-tab",       "cmd-w",         "cmd-n"]        # Switch App, Close Tab, New Window
      # Visual Row 4 (Bottom)
      - ["shift-cmd-4",   "shift-cmd-5",   "cmd-grave"]    # Screenshot, Record, Switch Window (Cmd+`)

    knobs:
      # Left Knob - TAB SWITCHING
      - ccw: "ctrl-shift-tab"    # Previous Tab
        press: "cmd-t"           # New Tab (Cmd+T)
        cw: "ctrl-tab"           # Next Tab
       
      # Right Knob (Top Right) - MUTE ON PRESS
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  # =================================================================
  # LAYER 2: USEFUL WEBSITES
  # =================================================================
  # STRATEGY: Nuclear Option (Ctrl+Cmd+Opt+Letters).
  # ACTION: Map these in Shortcuts App.
  # We use Ctrl + Cmd + Opt + Letters (A-I) to bypass Shortcut App limitations.
  # NOTE: Using 'opt' instead of 'alt' as requested.
  - buttons:
      # Visual Row 1 - LLMs
      # Gemini (A), Glean (B), ChatGPT (C)
      - ["ctrl-cmd-opt-a", "ctrl-cmd-opt-b", "ctrl-cmd-opt-c"]
       
      # Visual Row 2 - Work / Jira
      # Jira Board (D), Jira Form (E), Confluence (F)
      - ["ctrl-cmd-opt-d", "ctrl-cmd-opt-e", "ctrl-cmd-opt-f"]
       
      # Visual Row 3 - Personal / Utility
      # Calendar (G), Mail (H), Ring (I)
      - ["ctrl-cmd-opt-g", "ctrl-cmd-opt-h", "ctrl-cmd-opt-i"]
       
      # Visual Row 4 - TBD 
      - ["enter",        "enter",         "enter"]

    knobs:
      # Left Knob - TAB SWITCHING
      - ccw: "ctrl-shift-tab"    # Previous Tab
        press: "cmd-t"           # New Tab (Cmd+T)
        cw: "ctrl-tab"           # Next Tab
       
      # Right Knob (Top Right) - MUTE ON PRESS
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  # =================================================================
  # LAYER 3: PROGRAM COMMANDS & PROMPTS
  # =================================================================
  - buttons:
      # Visual Row 1 - Slack Commands
      - ["cmd-k",         "cmd-shift-a",  "cmd-shift-l"]
       
      # Visual Row 2 - G-Suite / Editing
      - ["cmd-b",         "cmd-i",        "cmd-k"]
       
      # Visual Row 3 - LLM Prompts (Triggers)
      # Replaced macro text with F-Keys because of 5-char limit.
      # F22 -> "role: ", F23 -> "context: ", F24 -> "task: "
      - ["f22",           "f23",          "f24"]
       
      # Visual Row 4 - Utilities
      - ["ctrl-cmd-q",    "enter",        "delete"]        # Lock Screen

    knobs:
      # Left Knob - TAB SWITCHING
      - ccw: "ctrl-shift-tab"    # Previous Tab
        press: "cmd-t"           # New Tab (Cmd+T)
        cw: "ctrl-tab"           # Next Tab
       
      # Right Knob (Top Right) - MUTE ON PRESS
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
